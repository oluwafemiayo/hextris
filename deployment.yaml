apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: hextris
  labels:
    app: hextris
  name: hextris
spec:
  replicas: 2
  selector:
    matchLabels:
      app: hextris
  template:
    metadata:
      labels:
        app: hextris
    spec:
      containers:
      - image: beltus325/hextris:latest
        name: hextris
        resources: 
          requests:
            memory: "500Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "500m"


---

apiVersion: v1
kind: Service
metadata:
  namespace: hextris
  labels:
    app: hextris
  name: hextris-service
spec:
  ports:
  - port: 80
    protocol: TCP
  selector:
    app: hextris



