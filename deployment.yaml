apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  annotations:  
    cert-manager.io/cluster-issuer: selfsigned-cluster-issuer
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
  namespace: hextris
  name: hextris
spec:
  ingressClassName: nginx
  rules:
  - host: hextris.rgfdevops.cloud
    http:
      paths:
      - backend:
          service: 
            name: hextris-service
            port:
              number: 80
        path: /
        pathType: Prefix
  tls:
  - hosts:
    - hextris.rgfdevops.cloud
    secretName: hextris-api-tls-secret
